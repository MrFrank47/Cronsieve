[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Cronsieve"
version = "0.1.0"
description = "Legge un file crontab, lo traduce in linguaggio naturale e segnala anomalie di pianificazione."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Cronsieve"}]
keywords = ["cron", "crontab", "cli", "scheduler"]

[project.scripts]
cronlens = "Cronsieve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
